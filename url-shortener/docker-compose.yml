services:
  api:
    build: .
    env_file: .env
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m

  redis:
    image: redis:7-alpine
    # Password comes from .env; AOF keeps links across restarts
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m

volumes:
  redis-data:
