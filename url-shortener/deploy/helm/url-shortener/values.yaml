replicaCount: 2

image:
  repository: ghcr.io/vionarion/url-shortener
  tag: ""        # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Rolling updates: the pod keeps serving for preStopSleepSeconds after it is removed from the
# Service, so in-flight connections are not refused (measured: 22 errors -> 0, see README).
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

# Spread replicas across nodes so losing one node takes out as few of them as possible.
# ScheduleAnyway was not enough: the scheduler put 3+3+0 pods on 3 nodes. nodeTaintsPolicy: Honor
# leaves NotReady (tainted) nodes out of the skew count, so a dead node does not block scheduling.
# matchLabelKeys: count only pods of the same ReplicaSet, otherwise the old pods of a rolling
# update skew the placement of the new ones (got 2+1+3).
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    matchLabelKeys: ["pod-template-hash"]
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "url-shortener.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: "1"
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Settings mapped to the app's environment variables (see url-shortener/.env.example).
config:
  domain: ""
  apiQuota: 10
  apiQuotaWindowMin: 30
  defaultExpiryHours: 24
  maxExpiryHours: 720
  codeLength: 7
  trustProxy: false

redis:
  # Redis runs outside this chart; only the connection details are configured here.
  addr: "redis:6379"
  existingSecret: ""     # Secret name holding the Redis password
  existingSecretKey: "redis-password"
