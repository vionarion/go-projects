apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "url-shortener.name" . }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "url-shortener.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "url-shortener.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: url-shortener
          image: {{ include "url-shortener.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_PORT
              value: ":{{ .Values.service.targetPort }}"
            - name: REDIS_ADDR
              value: {{ .Values.redis.addr | quote }}
            {{- if .Values.redis.existingSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.existingSecretKey }}
            {{- end }}
            - name: DOMAIN
              value: {{ .Values.config.domain | quote }}
            - name: API_QUOTA
              value: {{ .Values.config.apiQuota | quote }}
            - name: API_QUOTA_WINDOW_MIN
              value: {{ .Values.config.apiQuotaWindowMin | quote }}
            - name: DEFAULT_EXPIRY_HOURS
              value: {{ .Values.config.defaultExpiryHours | quote }}
            - name: MAX_EXPIRY_HOURS
              value: {{ .Values.config.maxExpiryHours | quote }}
            - name: CODE_LENGTH
              value: {{ .Values.config.codeLength | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.config.trustProxy | quote }}
          lifecycle:
            # Keep serving while the endpoint removal reaches every kube-proxy, then stop.
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
