# Applies everything under apps/ and keeps the cluster equal to git.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: go-projects
  path: ./url-shortener/deploy/flux/apps
  interval: 10m
  retryInterval: 1m
  prune: true
  wait: true
  timeout: 5m
