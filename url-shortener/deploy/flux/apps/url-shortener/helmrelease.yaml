# url-shortener released by Flux from the chart in this repo.
# Redis (deploy/redis) and the Redis password (deploy/vault) are managed outside this release.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: url-shortener
  namespace: urls
spec:
  releaseName: urls
  interval: 10m
  timeout: 2m
  chart:
    spec:
      chart: ./url-shortener/deploy/helm/url-shortener
      sourceRef:
        kind: GitRepository
        name: go-projects
        namespace: flux-system
      reconcileStrategy: Revision
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
      remediateLastFailure: true
      strategy: rollback
  driftDetection:
    mode: enabled
  values:
    autoscaling:
      minReplicas: 3
    image:
      tag: 9.9.9-broken
    config:
      apiQuota: 1000000
      domain: http://s.lab
    redis:
      existingSecret: redis
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: "1"
        memory: 64Mi
