# Vault 2.0 in HA mode: 3 pods (one per node), integrated Raft storage on PVCs, TLS everywhere.
# helm install vault hashicorp/vault --version 0.34.1 -n vault -f values-vault.yaml
global:
  tlsDisable: false

injector:
  enabled: false          # secrets reach apps through Vault Secrets Operator instead

server:
  image:
    repository: hashicorp/vault
    tag: "2.0.4"
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  extraEnvironmentVars:
    VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt
  extraVolumes:
    - {type: secret, name: vault-tls}
  dataStorage:
    size: 1Gi
  auditStorage:
    enabled: true
    size: 1Gi
  readinessProbe:
    # standby pods are ready too (they forward requests to the active node); sealed pods are not
    path: "/v1/sys/health?standbyok=true"
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true

        listener "tcp" {
          address            = "[::]:8200"
          cluster_address    = "[::]:8201"
          tls_cert_file      = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file       = "/vault/userconfig/vault-tls/tls.key"
          tls_client_ca_file = "/vault/userconfig/vault-tls/ca.crt"
          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr     = "https://vault-0.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
          retry_join {
            leader_api_addr     = "https://vault-1.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
          retry_join {
            leader_api_addr     = "https://vault-2.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
        }

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname          = true
        }

        service_registration "kubernetes" {}

ui:
  enabled: true
