# Vault Secrets Operator objects in the app namespace.
# The operator logs in to Vault as service account urls/vault-auth (role "urls", read-only policy),
# reads secret/urls/redis and writes Kubernetes Secret "redis", which Redis and url-shortener
# already use. When the value in Vault changes, only url-shortener is restarted: Redis picks up
# the new password live and accepts the previous one during the rollout (see ../redis/redis.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: urls
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: urls
spec:
  address: https://vault.vault.svc:8200
  caCertSecretRef: vault-ca        # created by tls.sh
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: urls
  namespace: urls
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: urls
    serviceAccount: vault-auth
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: redis
  namespace: urls
spec:
  vaultAuthRef: urls
  type: kv-v2
  mount: secret
  path: urls/redis
  refreshAfter: 30s
  destination:
    name: redis
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        redis-password:
          text: '{{- get .Secrets "password" -}}'
        redis-password-previous:
          text: '{{- get .Secrets "previous" -}}'
  rolloutRestartTargets:
    - kind: Deployment
      name: url-shortener
