name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [url-shortener, simple-web, word-game]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.project }}/go.mod
          cache-dependency-path: ${{ matrix.project }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...

  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [url-shortener, simple-web, word-game]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.project }}/go.mod
          cache-dependency-path: ${{ matrix.project }}/go.sum
      - name: govulncheck (known vulnerabilities in reachable code)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec (static security analysis)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...

  misconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan (Dockerfile, Helm chart)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: url-shortener
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: url-shortener
        run: cp .env.example .env && docker compose config -q
      - name: Build image
        run: docker build -t url-shortener url-shortener
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: url-shortener
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: helm lint
        working-directory: url-shortener/deploy/helm/url-shortener
        run: helm lint .
      - name: helm template + kubeconform
        working-directory: url-shortener/deploy/helm/url-shortener
        run: |
          helm template test . --set redis.existingSecret=redis-secret \
            | kubeconform -strict -summary -ignore-missing-schemas

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
